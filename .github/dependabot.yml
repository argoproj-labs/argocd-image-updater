version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/test/ginkgo"
      - "/registry-scanner"
    schedule:
      interval: "monthly"
    groups:
      cross-module-updates:
        group-by: "dependency-name"
        patterns:
          - "*"
    ignore:
      - dependency-name: k8s.io/*

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/test/e2e/containers"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/test/e2e/images/test-image"
    schedule:
      interval: "monthly"

